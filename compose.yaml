services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: food_tracker
      POSTGRES_PASSWORD: food_tracker
      POSTGRES_DB: food_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_tracker -d food_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15
  db-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: food_tracker_test
      POSTGRES_PASSWORD: food_tracker_test
      POSTGRES_DB: food_tracker_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_tracker_test -d food_tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
