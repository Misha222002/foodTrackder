[project]
name = "food-tracker-backend"
version = "0.1.0"
description = "Food Tracker REST API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=46,<50",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/food_tracker"]
